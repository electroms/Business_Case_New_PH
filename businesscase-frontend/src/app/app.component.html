<nav class="topbar" aria-label="Navigation principale">
  <div class="brand">{{ title }}</div>
  <div class="nav-links">
    <a routerLink="/">Accueil</a>
    <a *ngIf="isLoggedIn()" routerLink="/dashboard">Dashboard</a>
    <a *ngIf="isAdmin()" routerLink="/users">Utilisateurs</a>
    <a *ngIf="isLoggedIn(); else loginLink" href="#" (click)="logout($event)">Déconnexion</a>
    <ng-template #loginLink>
      <a routerLink="/login">Connexion</a>
    </ng-template>
  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>
