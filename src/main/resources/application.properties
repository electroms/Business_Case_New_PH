# Configuration de base
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Sécurité locale par défaut : valeurs non faibles pour un démarrage sans variables d’environnement.
spring.security.user.name=${APP_ADMIN_USERNAME:dev-admin}
spring.security.user.password=${APP_ADMIN_PASSWORD:ChangeMe!DevPassword!2026}
spring.security.user.roles=${APP_ADMIN_ROLES:ROLE_ADMIN,ROLE_USER}
app.jwt.secret=${JWT_SECRET:ThisIsADevJwtSecretKeyForLocalRun123}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Base de données locale utilisable sans profil prod
spring.datasource.url=${DB_URL:jdbc:h2:mem:businesscase;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

