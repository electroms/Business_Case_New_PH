# Configuration de base
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Sécurité par défaut : valeurs de remplacement explicites, mais le profil prod exige des variables réelles.
spring.security.user.name=${APP_ADMIN_USERNAME:CHANGE_ME_REQUIRED}
spring.security.user.password=${APP_ADMIN_PASSWORD:CHANGE_ME_REQUIRED}
spring.security.user.roles=${APP_ADMIN_ROLES:ROLE_ADMIN}
app.jwt.secret=${JWT_SECRET:CHANGE_ME_REQUIRED}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
spring.jpa.open-in-view=false

