# Configuration de base
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Sécurité par défaut (développement / tests) ; en production, le profil prod injecte les variables d'environnement.
spring.security.user.name=${APP_ADMIN_USERNAME:admin}
spring.security.user.password=${APP_ADMIN_PASSWORD:change-me-in-production}
spring.security.user.roles=${APP_ADMIN_ROLES:ADMIN}
app.jwt.secret=${JWT_SECRET:change-me-production-secret-key-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
spring.jpa.open-in-view=false

