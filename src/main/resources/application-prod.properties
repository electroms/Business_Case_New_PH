# Profil de production strict
server.port=${SERVER_PORT:8080}

# Désactivation des aides de dev et logs détaillés
spring.main.banner-mode=off
spring.output.ansi.enabled=never

# Sécurité applicative - variables obligatoires en production
spring.security.user.name=${APP_ADMIN_USERNAME}
spring.security.user.password=${APP_ADMIN_PASSWORD}
spring.security.user.roles=${APP_ADMIN_ROLES:ROLE_ADMIN,ROLE_USER}

# JWT - secret obligatoire, expiration configurable
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Base de données MySQL - variables obligatoires
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.open-in-view=false

# Logging production
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.fr.humanbooster.businesscasespring=INFO

# sécurité HTTP globale
server.error.include-stacktrace=never
server.error.include-message=never
